[build-system]
requires = []
build-backend = "planeon_trust.common.build_backend"
backend-path = ["src"]

[project]
name = "planeon-harness-trust-plane"
version = "0.1.0"
description = "Offline-first Planeon trust-plane service foundation"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "planeon-harness-sdk==0.1.0",
  "cryptography==49.0.0",
  "cffi==2.1.0",
  "pycparser==3.0",
]

[tool.planeon]
packet = "TRUST-002"
network-default = "disabled"
policy-backend-default = "http://127.0.0.1:8181/v1/data/planeon/authz/decision"

[tool.uv.sources]
cffi = { path = "/opt/planeon/wheelhouse/trust-002/cffi-2.1.0-cp312-cp312-macosx_11_0_arm64.whl" }
cryptography = { path = "/opt/planeon/wheelhouse/trust-002/cryptography-49.0.0-cp311-abi3-macosx_11_0_arm64.whl" }
planeon-harness-sdk = { path = "/opt/planeon/wheelhouse/trust-002/planeon_harness_sdk-0.1.0-py3-none-any.whl" }
pycparser = { path = "/opt/planeon/wheelhouse/trust-002/pycparser-3.0-py3-none-any.whl" }
