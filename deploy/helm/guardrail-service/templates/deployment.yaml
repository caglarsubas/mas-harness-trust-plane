apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "guardrail-service.name" . }}
  labels: {app.kubernetes.io/name: guardrail-service}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: guardrail-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: guardrail-service}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guardrail-service
          image: {{ include "guardrail-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080, protocol: TCP}]
          env:
            - {name: PLANEON_OIDC_REGISTRY_FILE, value: /var/run/planeon/oidc/oidc-registry.json}
            - {name: PLANEON_GUARDRAIL_PROFILE_KEYSET_FILE, value: /var/run/planeon/profile-keyset/profile-keyset.json}
            - {name: PLANEON_GUARDRAIL_PROFILE_FILES, value: /var/run/planeon/active-profiles/profile.json}
            - {name: PLANEON_READINESS_ORGANIZATION_ID, value: {{ required "readinessOrganizationId is required" .Values.readinessOrganizationId | quote }}}
            - name: DATABASE_DSN
              valueFrom: {secretKeyRef: {name: {{ required "existingSecrets.database is required" .Values.existingSecrets.database | quote }}, key: dsn}}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: oidc-registry, mountPath: /var/run/planeon/oidc, readOnly: true}
            - {name: profile-keyset, mountPath: /var/run/planeon/profile-keyset, readOnly: true}
            - {name: active-profiles, mountPath: /var/run/planeon/active-profiles, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
      volumes:
        - name: oidc-registry
          secret: {secretName: {{ required "existingSecrets.oidcRegistry is required" .Values.existingSecrets.oidcRegistry | quote }}}
        - name: profile-keyset
          secret: {secretName: {{ required "existingSecrets.profileKeyset is required" .Values.existingSecrets.profileKeyset | quote }}}
        - name: active-profiles
          secret: {secretName: {{ required "existingSecrets.activeProfiles is required" .Values.existingSecrets.activeProfiles | quote }}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
