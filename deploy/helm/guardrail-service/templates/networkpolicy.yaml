apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guardrail-service-deny-by-default
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: guardrail-service}}
  policyTypes: [Ingress, Egress]
{{- if .Values.networkPolicy.ingressNamespaceLabels }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
{{ toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports: [{protocol: TCP, port: 8080}]
{{- else }}
  ingress: []
{{- end }}
{{- if and .Values.networkPolicy.databaseNamespaceLabels .Values.networkPolicy.databasePodLabels }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
{{ toYaml .Values.networkPolicy.databaseNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
{{ toYaml .Values.networkPolicy.databasePodLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.networkPolicy.databasePort }}}]
{{- else }}
  egress: []
{{- end }}
